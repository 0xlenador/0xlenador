name: Add Tweet to Feed

on:
  repository_dispatch:
    types: [new_tweet]

jobs:
  add-tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch tweet data and update x_feed.json
        run: |
          # Get the tweet URL from Make.com
          TWEET_URL="${{ github.event.client_payload.url }}"

          # Convert x.com or twitter.com URL to VxTwitter API URL
          API_URL=$(echo "$TWEET_URL" | sed 's|x\.com|api.vxtwitter.com|' | sed 's|twitter\.com|api.vxtwitter.com|')

          echo "Fetching data from: $API_URL"

          # Call VxTwitter API to get tweet data
          RESPONSE=$(curl -s "$API_URL")

          echo "Response received, processing..."

          # Extract fields using jq
          FULL_TEXT=$(echo "$RESPONSE" | jq -r '.text // ""')
          RAW_DATE=$(echo "$RESPONSE" | jq -r '.date // ""')

          # Get first media type
          MEDIA_TYPE=$(echo "$RESPONSE" | jq -r '.media_extended[0].type // "image"')

          # Get media URL based on type
          if [ "$MEDIA_TYPE" = "video" ]; then
            # For videos: save the thumbnail (the .mp4 is useless due to CORS)
            MEDIA_URL=$(echo "$RESPONSE" | jq -r '.media_extended[0].thumbnail_url // ""')
            FORMAT="video"
          else
            # For images: save the image URL directly
            MEDIA_URL=$(echo "$RESPONSE" | jq -r '.mediaURLs[0] // ""')
            FORMAT="imagen"
          fi

          # If no media at all
          if [ -z "$MEDIA_URL" ] || [ "$MEDIA_URL" = "null" ]; then
            MEDIA_URL=""
            THUMBNAIL_URL=""
            FORMAT="texto"
          fi

          # Extract title = first non-empty line
          TITLE=$(echo "$FULL_TEXT" | sed '/^\s*$/d' | head -n 1)

          # Extract description = first 12 words of the second non-empty line
          DESCRIPTION=$(echo "$FULL_TEXT" | sed '/^\s*$/d' | sed -n '2p' | awk '{for(i=1;i<=12 && i<=NF;i++) printf "%s ", $i}' | sed 's/ $//')

          # Format date to YYYY-MM-DD
          FORMATTED_DATE=$(date -d "$RAW_DATE" +%Y-%m-%d 2>/dev/null || echo "$(date +%Y-%m-%d)")

          # Extract tweet ID from URL
          TWEET_ID=$(echo "$TWEET_URL" | grep -oP '\d{10,}' | head -1)

          echo "Title: $TITLE"
          echo "Description: $DESCRIPTION"
          echo "Media: $MEDIA_URL"
          echo "Thumbnail: $THUMBNAIL_URL"
          echo "Format: $FORMAT"
          echo "Date: $FORMATTED_DATE"

          # Use jq to safely build and prepend the new tweet
          jq --arg id "$TWEET_ID" \
             --arg tweetId "$TWEET_ID" \
             --arg title "$TITLE" \
             --arg desc "$DESCRIPTION" \
             --arg length "medio" \
             --arg format "$FORMAT" \
             --arg date "$FORMATTED_DATE" \
             --arg media "$MEDIA_URL" \
             '[{
               id: $id,
               tweetId: $tweetId,
               title: $title,
               title_en: "",
               description: $desc,
               description_en: "",
               length: $length,
               format: $format,
               date: $date,
               media: $media
             }] + .' src/content/data/x_feed.json > tmp.json
          mv tmp.json src/content/data/x_feed.json

          echo "x_feed.json updated successfully!"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/data/x_feed.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "🐦 Nuevo tweet añadido automáticamente"
          git push
