name: Add Tweet to Feed

on:
  repository_dispatch:
    types: [new_tweet]

concurrency:
  group: "tweet-update"
  cancel-in-progress: false

jobs:
  add-tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch tweet data and update x_feed.json
        run: |
          # Get the tweet URL from Make.com
          TWEET_URL="${{ github.event.client_payload.url }}"

          # Convert x.com or twitter.com URL to VxTwitter API URL
          API_URL=$(echo "$TWEET_URL" | sed 's|x\.com|api.vxtwitter.com|' | sed 's|twitter\.com|api.vxtwitter.com|')

          echo "Fetching data from: $API_URL"

          # Call VxTwitter API to get tweet data
          RESPONSE=$(curl -s "$API_URL")

          echo "Response received, processing..."

          # Combine texts from main text, article, and quoted tweet. Remove lines that are purely URLs.
          FULL_TEXT=$(echo "$RESPONSE" | jq -r '
            [
              .text,
              .article.title,
              .article.preview_text,
              .qrt.text
            ] | map(select(. != null and . != "")) | join("\n")
          ' | sed '/^http/ { /^[[:space:]]*https\?:\/\/[^[:space:]]*[[:space:]]*$/d; }')

          RAW_DATE=$(echo "$RESPONSE" | jq -r '.date // ""')

          # Smarter Media Extraction (Main tweet, then Article, then Quoted tweet)
          MEDIA_URL=$(echo "$RESPONSE" | jq -r '
            if .media_extended != null and (.media_extended | length) > 0 then
              if .media_extended[0].type == "video" then .media_extended[0].thumbnail_url
              else .mediaURLs[0] end
            elif .article.image != null then
              .article.image
            elif .qrt.media_extended != null and (.qrt.media_extended | length) > 0 then
              if .qrt.media_extended[0].type == "video" then .qrt.media_extended[0].thumbnail_url
              else .qrt.mediaURLs[0] end
            else
              ""
            end
          ')

          # Determine format based on where we found the media
          FORMAT=$(echo "$RESPONSE" | jq -r '
            if .media_extended != null and (.media_extended | length) > 0 then
              if .media_extended[0].type == "video" then "video" else "texto" end
            elif .article.image != null then
              "articulo"
            elif .qrt.media_extended != null and (.qrt.media_extended | length) > 0 then
              if .qrt.media_extended[0].type == "video" then "video" else "texto" end
            else
              "texto"
            end
          ')

          # Determine length dynamically
          if [ "$FORMAT" = "articulo" ]; then
            LENGTH="largo"
          elif [ "$FORMAT" = "video" ]; then
            # Extract duration_millis (falls back to 0 if null)
            DURATION_MS=$(echo "$RESPONSE" | jq -r '
              if .media_extended != null and (.media_extended | length) > 0 and .media_extended[0].type == "video" then .media_extended[0].duration_millis
              elif .qrt.media_extended != null and (.qrt.media_extended | length) > 0 and .qrt.media_extended[0].type == "video" then .qrt.media_extended[0].duration_millis
              else 0 end
            ')
            if [ -z "$DURATION_MS" ] || [ "$DURATION_MS" = "null" ]; then
              DURATION_MS=0
            fi
            
            # 1 minute = 60000 ms, 15 minutes = 900000 ms
            if [ "$DURATION_MS" -le 60000 ]; then
              LENGTH="corto"
            elif [ "$DURATION_MS" -le 900000 ]; then
              LENGTH="mediano"
            else
              LENGTH="largo"
            fi
          else
            # For "texto", count words in FULL_TEXT
            WORD_COUNT=$(echo "$FULL_TEXT" | wc -w)
            if [ "$WORD_COUNT" -le 45 ]; then
              LENGTH="corto"
            elif [ "$WORD_COUNT" -le 100 ]; then
              LENGTH="mediano"
            else
              LENGTH="largo"
            fi
          fi

          # Extract title = first non-empty line
          TITLE=$(echo "$FULL_TEXT" | sed '/^\s*$/d' | head -n 1)

          # Get body text by removing the title and joining all remaining lines with a space
          BODY_TEXT=$(echo "$FULL_TEXT" | sed '/^\s*$/d' | tail -n +2 | tr '\n' ' ' | sed 's/  */ /g')

          # Extract description = first 15 words of the body text (ignoring newlines)
          DESCRIPTION=$(echo "$BODY_TEXT" | awk '{for(i=1;i<=15 && i<=NF;i++) printf "%s ", $i}' | sed 's/ $//')

          # Extract hidden_text = next 70 words (words 16 to 85) for future filtering
          HIDDEN_TEXT=$(echo "$BODY_TEXT" | awk '{for(i=16;i<=85 && i<=NF;i++) printf "%s ", $i}' | sed 's/ $//')

          # Format date to YYYY-MM-DD
          FORMATTED_DATE=$(date -d "$RAW_DATE" +%Y-%m-%d 2>/dev/null || echo "$(date +%Y-%m-%d)")

          # Extract tweet ID from URL
          TWEET_ID=$(echo "$TWEET_URL" | grep -oP '\d{10,}' | head -1)

          # Extract existing fields if the tweet is already in x_feed.json
          EXISTING_TITLE_EN=$(jq -r ".[] | select(.id == \"$TWEET_ID\") | .title_en // empty" src/content/data/x_feed.json)
          EXISTING_DESC_EN=$(jq -r ".[] | select(.id == \"$TWEET_ID\") | .description_en // empty" src/content/data/x_feed.json)
          EXISTING_HIDDEN_EN=$(jq -r ".[] | select(.id == \"$TWEET_ID\") | .hidden_text_en // empty" src/content/data/x_feed.json)
          EXISTING_HIDDEN_ES=$(jq -r ".[] | select(.id == \"$TWEET_ID\") | .hidden_text // empty" src/content/data/x_feed.json)

          # If the new hidden text is empty but we have an old one, preserve it
          if [ -z "$HIDDEN_TEXT" ] && [ -n "$EXISTING_HIDDEN_ES" ]; then
            HIDDEN_TEXT="$EXISTING_HIDDEN_ES"
          fi

          echo "Translating to English..."
          pip install deep-translator --quiet --break-system-packages
          
          export TITLE_ES="$TITLE"
          export DESC_ES="$DESCRIPTION"
          export HIDDEN_ES="$HIDDEN_TEXT"
          
          export EXISTING_TITLE_EN="$EXISTING_TITLE_EN"
          export EXISTING_DESC_EN="$EXISTING_DESC_EN"
          export EXISTING_HIDDEN_EN="$EXISTING_HIDDEN_EN"

          python -c "
          import os
          import re
          import random
          from deep_translator import GoogleTranslator, MyMemoryTranslator
          import time
          
          def clean_cashtags(text):
              if not text: return ''
              # Replace known specific cashtags
              text = text.replace('solana:dog1viwbb2vWDpER5FrJ4YFG6gq6XuyFohUe9TXN65u', '\$DOG')
              text = text.replace('bitcoin:native', '\$BTC')
              text = text.replace('blockstack:native', '\$STX')
              text = text.replace('base:0x3e12b9d6a4d12cd9b4a6d613872d0eb32f68b380', '\$FLOWER')
              # Fallback for any other long addresses
              text = re.sub(r'(base|ethereum|polygon|optimism|arbitrum):0x[a-fA-F0-9]{40}', '[\$TOKEN]', text)
              text = re.sub(r'solana:[1-9A-HJ-NP-Za-km-z]{32,44}', '[\$TOKEN]', text)
              return text

          def translate(text):
              if not text or not text.strip(): return ''
              # Hacer una pausa "humana" aleatoria de 2 a 4 segundos antes de pedir a Google
              time.sleep(random.uniform(2.0, 4.0)) 
              try:
                  return GoogleTranslator(source='es', target='en').translate(text)
              except Exception as e:
                  print('GoogleTranslation error:', e)
                  try:
                      time.sleep(1) # Pequeña pausa antes de intentar el fallback
                      return MyMemoryTranslator(source='spanish', target='english').translate(text)
                  except Exception as e2:
                      print('MyMemoryTranslation error:', e2)
                      return ''
          
          title_es = clean_cashtags(os.environ.get('TITLE_ES', ''))
          desc_es = clean_cashtags(os.environ.get('DESC_ES', ''))
          hidden_es = clean_cashtags(os.environ.get('HIDDEN_ES', ''))
          
          ex_title_en = os.environ.get('EXISTING_TITLE_EN', '').strip()
          ex_desc_en = os.environ.get('EXISTING_DESC_EN', '').strip()
          ex_hidden_en = os.environ.get('EXISTING_HIDDEN_EN', '').strip()
          
          title_en = ex_title_en if ex_title_en else translate(title_es)
          desc_en = ex_desc_en if ex_desc_en else translate(desc_es)
          hidden_en = ex_hidden_en if ex_hidden_en else translate(hidden_es)
          
          import shlex
          
          with open('translations.env', 'w', encoding='utf-8') as f:
              f.write(f'TITLE={shlex.quote(title_es)}\n')
              f.write(f'DESCRIPTION={shlex.quote(desc_es)}\n')
              f.write(f'HIDDEN_TEXT={shlex.quote(hidden_es)}\n')
              f.write(f'TITLE_EN={shlex.quote(title_en)}\n')
              f.write(f'DESC_EN={shlex.quote(desc_en)}\n')
              f.write(f'HIDDEN_EN={shlex.quote(hidden_en)}\n')
          "
          source translations.env

          echo "Title: $TITLE"
          echo "Title EN: $TITLE_EN"
          echo "Description: $DESCRIPTION"
          echo "Media: $MEDIA_URL"
          echo "Thumbnail: $THUMBNAIL_URL"
          echo "Format: $FORMAT"
          echo "Date: $FORMATTED_DATE"

          # Use jq to safely build and prepend the new tweet
          jq --arg id "$TWEET_ID" \
             --arg tweetId "$TWEET_ID" \
             --arg title "$TITLE" \
             --arg title_en "$TITLE_EN" \
             --arg desc "$DESCRIPTION" \
             --arg desc_en "$DESC_EN" \
             --arg hiddenText "$HIDDEN_TEXT" \
             --arg hiddenText_en "$HIDDEN_EN" \
             --arg length "$LENGTH" \
             --arg format "$FORMAT" \
             --arg date "$FORMATTED_DATE" \
             --arg media "$MEDIA_URL" \
             '[{
               id: $id,
               tweetId: $tweetId,
               title: $title,
               title_en: $title_en,
               description: $desc,
               description_en: $desc_en,
               hidden_text: $hiddenText,
               hidden_text_en: $hiddenText_en,
               length: $length,
               format: $format,
               date: $date,
               media: $media
             }] + [ .[] | select(.id != $id) ]' src/content/data/x_feed.json > tmp.json
          mv tmp.json src/content/data/x_feed.json

          echo "x_feed.json updated successfully!"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/data/x_feed.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "🐦 Nuevo tweet añadido automáticamente"
          git push
