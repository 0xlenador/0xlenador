name: SFL Mercado Updater

on:
  schedule:
    # Se ejecuta todos los días a las 00:00, 06:00, 12:00 y 18:00 UTC
    - cron: "0 * * * *"
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Obtener y actualizar los datos estáticos de SFL
        run: node scripts/update_sfl.js

      - name: Commit y Push si hubo cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/api/sfl_data.json
          # Si no hay cambios git commit devuelve error, lo silenciamos y salimos amigablemente
          git commit -m "chore: actualización automática de datos de mercado SFL" || echo "Sin cambios para commitear"
          git push
