name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Problema 7 — Disparar el deploy automáticamente cuando el cron de SFL termina.
  # Los commits del bot (GITHUB_TOKEN) no disparan workflows, así que usamos
  # workflow_run que se activa cuando otro workflow completa exitosamente.
  workflow_run:
    workflows: ["SFL Mercado Updater", "Add Tweet to Feed"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Si fue disparado por workflow_run, solo continuar si el cron terminó con éxito
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js (Fuerza v22 obligatorio para Astro v6)
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install

      - name: Compilar sitio estático
        run: pnpm run build

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
